name: nessy-ap
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nessyap
      POSTGRES_PASSWORD: nessyap
    ports:
      - "55432:5432"
    volumes:
      - ./compose/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    ports:
      - "55672:5672"
      - "55673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./compose/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./compose/rabbitmq/10-definitions.conf:/etc/rabbitmq/conf.d/10-definitions.conf:ro
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "58080:8080"
    volumes:
      - ./compose/keycloak:/opt/keycloak/data/import:ro
  opa:
    image: openpolicyagent/opa:0.68.0
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "--watch", "/policy"]
    ports:
      - "58181:8181"
    volumes:
      - ./compose/opa/policy:/policy:ro
  # Mail for the desk and everyone it writes to. Measured 2026-10-03: SMTP accepts any recipient;
  # the desk logs in to IMAP as ap-desk@nessy-ap.example / ap-desk (users.login=email makes the
  # whole address the login). Any other mailbox appears on first delivery, its address as login
  # and password.
  greenmail:
    image: greenmail/standalone:2.1.14
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=ap-desk:ap-desk@nessy-ap.example -Dgreenmail.users.login=email
    ports:
      - "53025:3025"
      - "53143:3143"
volumes:
  postgres-data:
  rabbitmq-data:
