site_name: Nessy AP
site_description: An accounts-payable exception desk built on Nessy, with the controls, trust boundaries and evaluation an enterprise needs.
site_url: https://jwcarman.github.io/nessy-ap/
repo_url: https://github.com/jwcarman/nessy-ap
repo_name: jwcarman/nessy-ap
edit_uri: edit/main/docs/

docs_dir: docs

# Specs, plans and ledgers are working notes, not documentation. They stay out of the site.
exclude_docs: |
  /superpowers/

theme:
  name: material
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works: system.md
  - Evaluation:
      - evaluation/index.md
      - "Slice 4: authority": evaluation/slice-4-enforcement.md
      - "Slice 5: mail": evaluation/slice-5-mail.md
      - "Slice 6: the full evaluation": evaluation/slice-6-evaluation.md
      - "Slice 7: the Camel inbox": evaluation/slice-7-camel-inbox.md
  - Nessy:
      - Assessing Nessy for this use case: nessy-assessment.md
      - Findings: findings.md
  - Occlude:
      - Assessing Occlude for this use case: occlude-assessment.md
