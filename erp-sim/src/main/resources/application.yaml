server:
  port: 8081
spring:
  application:
    name: erp-sim
  datasource:
    url: jdbc:postgresql://localhost:55432/erp
    username: nessyap
    password: nessyap
  rabbitmq:
    host: localhost
    port: 55672
    username: nessyap
    password: nessyap
    publisher-confirm-type: simple
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
erp:
  security:
    jwk-set-uri: http://localhost:58080/realms/nessy-ap/protocol/openid-connect/certs
    issuer: http://localhost:58080/realms/nessy-ap
    audience: erp-sim
  matching:
    price-tolerance-percent: 2
  outbox:
    poll-interval-ms: 500
management:
  endpoints:
    web:
      exposure:
        include: health,info
