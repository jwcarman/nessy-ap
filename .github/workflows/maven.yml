name: CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check:
    name: Formatting and licence headers
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven

    - name: Check formatting and licence headers
      run: ./mvnw -B spotless:check license:check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven

    # The tests start their own Postgres, RabbitMQ, OPA and mail server (Testcontainers) and need
    # no model and no Keycloak. A pull request from a fork has no SONAR_TOKEN, so it builds without
    # the scan.
    - name: Build with Maven
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        if [ -n "$SONAR_TOKEN" ]; then
          ./mvnw -Pci -B verify sonar:sonar -Dsonar.qualitygate.wait=true
        else
          ./mvnw -Pci -B verify
        fi
