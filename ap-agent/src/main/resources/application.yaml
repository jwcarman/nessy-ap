server:
  port: 8082
spring:
  application:
    name: ap-agent
  # Development secrets, written by scripts/dev-secrets.sh and never committed.
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:55432/apagent
    username: nessyap
    password: nessyap
  mail:
    host: localhost
    port: 53025
    # A send happens inside the agent's turn: never wait on a hung server for long.
    properties:
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
  rabbitmq:
    host: localhost
    port: 55672
    username: nessyap
    password: nessyap
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: workbench
            client-secret: workbench-secret
            authorization-grant-type: authorization_code
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: http://localhost:58080/realms/nessy-ap
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: http://localhost:58080/realms/nessy-ap
          jwk-set-uri: http://localhost:58080/realms/nessy-ap/protocol/openid-connect/certs
nessy:
  # The model the agent reasons with. The default is the local pair measured to work with Nessy:
  # Qwen3-Coder-30B in LM Studio. Point AP_PROVIDER / AP_MODEL elsewhere to compare.
  provider: ${AP_PROVIDER:lmstudio}
  model: ${AP_MODEL:qwen/qwen3-coder-30b}
  max-tokens: 4096
  providers:
    lmstudio:
      enabled: true
      base-url: ${AP_MODEL_URL:http://localhost:1234/v1}
  # A fixed key, so a decision that waits on a person survives a restart. It comes from the
  # environment or .env (scripts/dev-secrets.sh); no key is committed.
  reply-token-encryption-keys:
    - ${AP_REPLY_KEY}
ap:
  # Nessy's stored history, encrypted under a key of its own (NessyStorageEncryption).
  nessy-storage:
    key-id: dev
    kek: ${AP_NESSY_KEK}
  erp:
    base-url: http://localhost:8081
    token-uri: http://localhost:58080/realms/nessy-ap/protocol/openid-connect/token
    client-id: ap-agent-service
    client-secret: ap-agent-secret
  opa:
    url: http://localhost:58181
  approval:
    timeout: P3D
  decisions:
    auto: false
  # The quarantined reader of incoming mail: a small model with no tools (see docs/system.md).
  quarantine:
    reader:
      enabled: true
      provider: ${AP_READER_PROVIDER:${nessy.provider}}
      model: ${AP_READER_MODEL:google/gemma-4-e4b}
      timeout: PT30S
  # Development only: a page (and API) for answering the desk's mail as its recipient.
  counterparty:
    enabled: true
  mail:
    desk-address: ap-desk@nessy-ap.example
    people-domain: nessy-ap.example
    max-per-case: 3
    poll:
      enabled: true
      delay-ms: 2000
    imap:
      host: localhost
      port: 53143
      username: ap-desk@nessy-ap.example
      password: ap-desk
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
# The quarantine for untrusted text (Occlude). The key and the root come from the environment or
# .env (scripts/dev-secrets.sh). None is committed: without them the desk refuses to start.
occlude:
  keys:
    current: dev
    keks:
      dev: ${OCCLUDE_KEK}
  roots:
    current: dev
    secrets:
      dev: ${OCCLUDE_ROOT}
  migrate: true

